<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --surface: #f1f1ee;
    --ink: #1d1f21;
    --muted: #6b6f74;
    --line: #dddedb;
    --accent: #3a6ea5;
    --accent-ink: #ffffff;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
      "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
      Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #16181b;
      --surface: #1e2126;
      --ink: #d9dbde;
      --muted: #8b9097;
      --line: #2c3036;
      --accent: #82aed6;
      --accent-ink: #16181b;
    }
  }
  /* Explicit choice via the theme toggle overrides the system preference */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fbfbfa;
    --surface: #f1f1ee;
    --ink: #1d1f21;
    --muted: #6b6f74;
    --line: #dddedb;
    --accent: #3a6ea5;
    --accent-ink: #ffffff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16181b;
    --surface: #1e2126;
    --ink: #d9dbde;
    --muted: #8b9097;
    --line: #2c3036;
    --accent: #82aed6;
    --accent-ink: #16181b;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    margin: 0;
  }
  .wrap {
    max-width: 44rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }
  a {
    color: var(--accent);
    text-underline-offset: 2px;
  }
  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  code {
    font-family: var(--mono);
  }
  .hidden {
    display: none !important;
  }

  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.75rem;
    font-weight: 600;
  }
  h1 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
  }
  h2 {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 1rem;
  }

  /* ---- top bar ---- */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.75rem;
  }
  .top .host {
    font-family: var(--mono);
    font-size: 0.9rem;
  }
  .top .sponsor {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .top .side {
    display: flex;
    align-items: baseline;
    gap: 1rem;
  }
  .theme-toggle {
    font: 0.85rem var(--sans);
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
    cursor: pointer;
    line-height: 1.4;
  }
  .theme-toggle:hover {
    color: var(--ink);
  }

  /* ---- hero ---- */
  .ip-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
  }
  .ip {
    font-family: var(--mono);
    font-size: clamp(2rem, 7vw, 3.25rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .copy {
    font: 600 0.8rem var(--sans);
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 4px;
    padding: 0.45rem 0.9rem;
    cursor: pointer;
  }
  .curl-hint {
    margin: 0.75rem 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .curl-hint code {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.15rem 0.4rem;
  }

  /* ---- details list ---- */
  dl {
    margin: 0;
    border-top: 1px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 11rem 1fr;
    gap: 1rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--line);
  }
  dt {
    color: var(--muted);
    font-size: 0.9rem;
  }
  dd {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.9rem;
    word-break: break-word;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 480px) {
    .row {
      grid-template-columns: 1fr;
      gap: 0.1rem;
    }
  }
  .attribution {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0.75rem 0 0;
  }

  /* ---- api widget ---- */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .chip {
    font: 500 0.85rem var(--mono);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .port-input {
    font: 0.85rem var(--mono);
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
    width: 5rem;
  }
  .terminal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.85rem;
    overflow: hidden;
  }
  .terminal .cmd {
    padding: 0.6rem 0.85rem;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    overflow-x: auto;
  }
  .terminal .cmd::before {
    content: "$ ";
    color: var(--muted);
  }
  .terminal .out {
    padding: 0.6rem 0.85rem;
    min-height: 3.5em;
    margin: 0;
    white-space: pre;
    overflow-x: auto;
    color: var(--muted);
  }
  .query-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.75rem;
    font-size: 0.85rem;
  }
  .query-row input {
    font: 0.85rem var(--mono);
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.4rem 0.6rem;
    width: 11rem;
  }
  .query-row .go {
    font: 600 0.8rem var(--sans);
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
  }

  /* ---- map + faq ---- */
  details {
    border-top: 1px solid var(--line);
    padding: 0.65rem 0;
  }
  details:last-of-type {
    border-bottom: 1px solid var(--line);
  }
  summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
  }
  summary::marker {
    color: var(--accent);
  }
  details p {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0.5rem 0 0.25rem;
  }
  details p code {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.1rem 0.35rem;
    font-size: 0.85em;
  }
  iframe.map {
    display: block;
    margin-top: 0.75rem;
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>
