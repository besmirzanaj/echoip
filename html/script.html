<script>
  const host = "{{ .Host }}";
  const data = JSON.parse("{{ .JSON }}");
  const cmdBox = document.getElementById("cmd");
  const outBox = document.getElementById("out");
  const portInput = document.getElementById("portInput");
  const ipInput = document.getElementById("ipInput");

  let endpoint = "ip";
  let queryIP = ipInput ? ipInput.value.trim() : "";
  let port = portInput ? portInput.value : "8080";

  function currentPath() {
    if (endpoint === "ip") return "";
    if (endpoint === "port") return "port/" + port;
    return endpoint;
  }

  function currentQuery() {
    return queryIP ? "?ip=" + encodeURIComponent(queryIP) : "";
  }

  function render() {
    cmdBox.textContent = "curl " + host + "/" + currentPath() + currentQuery();
    let out;
    switch (endpoint) {
      case "json":
        out = JSON.stringify(data, null, 2);
        break;
      case "country-iso":
        out = data["country_iso"];
        break;
      case "port":
        out = "{}";
        break;
      default:
        out = data[endpoint];
    }
    outBox.textContent = out === undefined ? "" : out;
  }

  function pick(button, name) {
    endpoint = name;
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.setAttribute("aria-pressed", chip === button ? "true" : "false");
    });
    if (portInput) {
      portInput.classList.toggle("hidden", name !== "port");
    }
    render();
  }

  function setPort(value) {
    port = value;
    render();
  }

  function setQueryIP(value) {
    queryIP = value.trim();
    render();
  }

  function openQuery() {
    window.location = "/" + currentPath() + currentQuery();
  }

  function copyIP(button) {
    navigator.clipboard
      .writeText(document.getElementById("myip").textContent)
      .then(() => {
        button.textContent = "Copied";
        setTimeout(() => (button.textContent = "Copy"), 1500);
      });
  }

  function toggleTheme() {
    const root = document.documentElement;
    const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const current = root.dataset.theme || (systemDark ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try {
      localStorage.setItem("theme", next);
    } catch (e) {}
  }

  const mapDetails = document.getElementById("mapDetails");
  if (mapDetails) {
    mapDetails.addEventListener("toggle", () => {
      const frame = mapDetails.querySelector("iframe");
      if (mapDetails.open && frame && !frame.src) {
        frame.src = frame.dataset.src;
      }
    });
  }

  render();
</script>
