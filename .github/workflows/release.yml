name: release

on:
  push:
    tags:
      - 'v*'

env:
  CHARTS_REPO: besmirzanaj/charts
  CHART_PATH: charts/ifconfig

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Docker Image
            ```
            ghcr.io/besmirzanaj/echoip:${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false

  update-helm-chart:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout charts repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CHARTS_REPO }}
          token: ${{ secrets.CHARTS_PAT }}
          path: charts-repo

      - name: Update Chart.yaml version and appVersion
        working-directory: charts-repo
        run: |
          CHART_FILE="${{ env.CHART_PATH }}/Chart.yaml"
          VERSION="${{ steps.version.outputs.version }}"
          
          # Update appVersion to match the release version
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" "$CHART_FILE"
          
          # Bump chart version (increment patch)
          CURRENT_CHART_VERSION=$(grep '^version:' "$CHART_FILE" | awk '{print $2}' | tr -d '"')
          
          # Parse semver and increment minor version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_CHART_VERSION"
          NEW_MINOR=$((MINOR + 1))
          NEW_CHART_VERSION="${MAJOR}.${NEW_MINOR}.0"
          
          sed -i "s/^version:.*/version: \"$NEW_CHART_VERSION\"/" "$CHART_FILE"
          
          echo "Updated chart version: $CURRENT_CHART_VERSION -> $NEW_CHART_VERSION"
          echo "Updated appVersion: $VERSION"

      - name: Update values.yaml image tag
        working-directory: charts-repo
        run: |
          VALUES_FILE="${{ env.CHART_PATH }}/values.yaml"
          VERSION="${{ steps.version.outputs.version }}"
          
          # Update the image tag from "latest" to the specific version
          sed -i "s/^  tag:.*/  tag: \"$VERSION\"/" "$VALUES_FILE"
          
          echo "Updated image tag to: $VERSION"

      - name: Commit and push changes
        working-directory: charts-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          
          VERSION="${{ steps.version.outputs.version }}"
          git commit -m "chore(ifconfig): bump appVersion to $VERSION"
          git push
